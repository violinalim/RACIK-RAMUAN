<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Magic Cauldron</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08040b
}

body{
    font-family:Arial,sans-serif;
    touch-action:manipulation
}

/* =========================
   BACKGROUND
========================= */

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:100svh;
    overflow:hidden;

    background:
    #09050d
    url("https://plcl.me/images/ohwiK.png")
    center/cover no-repeat;

    user-select:none
}

.scene:after{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        transparent 58%,
        rgba(0,0,0,.2)
    );

    pointer-events:none;
    z-index:1
}

/* =========================
   STAGE
========================= */

.stage{
    position:absolute;

    left:50%;
    bottom:2%;

    width:820px;
    height:700px;

    transform:
    translateX(-50%);

    transform-origin:
    center bottom;

    z-index:10
}

/* =========================
   FLOOR SHADOW
========================= */

.shadow{
    position:absolute;

    left:50%;
    bottom:14px;

    width:330px;
    height:55px;

    transform:
    translateX(-50%);

    border-radius:50%;

    background:
    radial-gradient(
        ellipse,
        rgba(0,0,0,.75),
        transparent 70%
    );

    filter:blur(10px)
}

/* =========================
   CAULDRON
========================= */

.cauldron{
    position:absolute;

    left:50%;
    bottom:30px;

    width:520px;
    height:470px;

    transform:
    translateX(-50%)
    scale(.72);

    transform-origin:
    center bottom
}

/* BODY */

.body{
    position:absolute;

    left:50%;
    bottom:60px;

    width:420px;
    height:255px;

    transform:
    translateX(-50%);

    border-radius:
    40% 40% 48% 48% /
    22% 22% 76% 76%;

    background:
    linear-gradient(
        90deg,
        #030304,
        #29262e 25%,
        #08070a 52%,
        #302d35 72%,
        #020203
    );

    border:
    3px solid #514b57;

    box-shadow:
    inset 24px 4px 35px rgba(255,255,255,.04),
    inset -30px -20px 42px rgba(0,0,0,.9),
    0 28px 35px rgba(0,0,0,.65);

    z-index:30
}

/* RIM */

.rim{
    position:absolute;

    left:50%;
    bottom:270px;

    width:455px;
    height:104px;

    transform:
    translateX(-50%);

    border-radius:50%;

    background:
    linear-gradient(
        #59535e,
        #27222b 25%,
        #09070b 60%,
        #17131a
    );

    border:
    4px solid #625b68;

    box-shadow:
    inset 0 8px 12px rgba(255,255,255,.1),
    inset 0 -12px 22px rgba(0,0,0,.95),
    0 13px 17px rgba(0,0,0,.6);

    z-index:45
}

/* =========================
   MAGIC LIQUID
========================= */

.liquid{
    position:absolute;

    left:50%;
    bottom:292px;

    width:388px;
    height:72px;

    transform:
    translateX(-50%);

    border-radius:50%;

    overflow:hidden;

    background:
    radial-gradient(
        ellipse at 50% 40%,
        #efb0ff,
        #cb4dff 18%,
        #8d18d0 45%,
        #310046 100%
    );

    box-shadow:
    0 0 15px rgba(202,83,255,.5),
    inset 0 5px 12px rgba(255,255,255,.2);

    animation:
    boil 1.5s
    ease-in-out
    infinite alternate;

    z-index:50
}

.liquid:after{
    content:"";

    position:absolute;

    left:17%;
    top:10px;

    width:60%;
    height:12px;

    border-radius:50%;

    background:
    rgba(255,255,255,.18);

    filter:
    blur(5px)
}

@keyframes boil{

    to{
        transform:
        translateX(-50%)
        scaleX(1.02)
        scaleY(1.05)
    }

}

/* =========================
   HANDLE
========================= */

.handle{
    position:absolute;

    bottom:168px;

    width:92px;
    height:120px;

    border:
    14px solid #111014;

    border-radius:50%;

    z-index:24
}

.handle.l{
    left:-2px;
    transform:rotate(-9deg)
}

.handle.r{
    right:-2px;
    transform:rotate(9deg)
}

/* =========================
   LEGS
========================= */

.leg{
    position:absolute;

    bottom:20px;

    width:76px;
    height:112px;

    border-radius:
    35% 35% 25% 25%;

    background:
    linear-gradient(
        90deg,
        #050506,
        #2c2930,
        #080809
    );

    z-index:20
}

.leg.l{
    left:102px;
    transform:rotate(12deg)
}

.leg.r{
    right:102px;
    transform:rotate(-12deg)
}

/* =========================
   WATER WAVE
========================= */

.wave{
    position:absolute;

    left:50%;
    bottom:300px;

    width:260px;
    height:46px;

    border:
    2px solid
    rgba(245,204,255,.25);

    border-radius:50%;

    transform:
    translateX(-50%);

    animation:
    wave 1.2s
    ease-out infinite;

    z-index:55
}

.w2{
    animation-delay:.4s
}

.w3{
    animation-delay:.8s
}

@keyframes wave{

    0%{
        opacity:.75;

        transform:
        translateX(-50%)
        scale(.4)
    }

    100%{
        opacity:0;

        transform:
        translateX(-50%)
        scale(1.4)
    }

}

/* =========================
   EFFECT AREA
========================= */

#bubbles,
#smoke{
    position:absolute;

    left:50%;

    transform:
    translateX(-50%);

    pointer-events:none
}

#bubbles{
    bottom:290px;

    width:360px;
    height:165px;

    z-index:65
}

#smoke{
    bottom:306px;

    width:650px;
    height:450px;

    z-index:80
}

/* =========================
   BUBBLE
========================= */

.bubble{
    position:absolute;

    bottom:20px;

    border-radius:50%;

    border:
    1px solid
    rgba(245,190,255,.65);

    background:
    radial-gradient(
        circle at 28% 23%,
        rgba(255,255,255,.9),
        rgba(196,72,255,.45) 38%,
        rgba(119,8,175,.55) 78%
    );

    animation:
    bubble var(--d)
    ease-out forwards
}

@keyframes bubble{

    0%{
        opacity:0;

        transform:
        translateY(5px)
        scale(.25)
    }

    15%{
        opacity:1
    }

    100%{
        opacity:0;

        transform:
        translate(
            var(--x),
            -85px
        )
        scale(1.45)
    }

}

/* =========================
   SMOKE
========================= */

.smoke{
    position:absolute;

    bottom:-10px;

    width:var(--s);

    height:
    calc(var(--s)*1.35);

    border-radius:50%;

    background:
    radial-gradient(
        ellipse,
        rgba(224,145,255,.6),
        rgba(160,45,225,.3) 42%,
        rgba(80,10,130,.08) 72%,
        transparent
    );

    filter:
    blur(var(--b));

    animation:
    smoke var(--d)
    ease-out forwards
}

@keyframes smoke{

    0%{
        opacity:0;

        transform:
        translate(-50%,5px)
        scale(.4)
    }

    15%{
        opacity:.55
    }

    100%{
        opacity:0;

        transform:
        translate(
            calc(-50% + var(--x)),
            var(--y)
        )
        scale(2.1)
    }

}

/* =========================
   BOTTLES
========================= */

.bottles{
    position:absolute;

    right:0;
    bottom:0;

    width:430px;
    height:590px;

    z-index:120
}

.bottle{
    position:absolute;

    width:140px;
    height:170px;

    border:0;

    background:
    transparent;

    cursor:pointer;

    transform-origin:
    50% 82%;

    animation:
    float 3s
    ease-in-out infinite;

    z-index:125;

    --px:0
}

/* PURPLE */

.bottle.purple{
    left:8px;
    bottom:350px;

    --px:58px
}

/* GREEN */

.bottle.green{
    left:144px;
    bottom:315px;

    --px:10px;

    animation-delay:.4s
}

/* BLUE */

.bottle.blue{
    left:280px;
    bottom:348px;

    --px:-38px;

    animation-delay:.8s
}

/* IMAGE */

.bottle img{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;

    filter:
    drop-shadow(
        0 10px 10px
        rgba(0,0,0,.2)
    );

    transition:
    opacity .15s
}

/* CLOSED / OPEN */

.bottle .open{
    opacity:0
}

.bottle.active .closed{
    opacity:0
}

.bottle.active .open{
    opacity:1
}

/* ACTIVE */

.bottle.active{
    z-index:170;

    pointer-events:none;

    animation:
    pour 2.65s
    cubic-bezier(.4,0,.2,1)
    both
}

/* FLOAT */

@keyframes float{

    50%{
        transform:
        translateY(-8px)
        rotate(1.5deg)
    }

}

/* POUR MOVEMENT */

@keyframes pour{

    0%{
        transform:
        translate(0)
        rotate(0)
    }

    14%{
        transform:
        translate(-8px,-70px)
        rotate(-8deg)
    }

    35%{
        transform:
        translate(
            calc(var(--px)*.35),
            -145px
        )
        rotate(-28deg)
    }

    47%,
    70%{
        transform:
        translate(
            var(--px),
            -205px
        )
        rotate(-72deg)
    }

    78%{
        transform:
        translate(
            calc(var(--px)*.25),
            -135px
        )
        rotate(-24deg)
    }

    100%{
        transform:
        translate(0)
        rotate(0)
    }

}

/* =========================
   POUR STREAM
========================= */

.stream{
    position:absolute;

    left:50%;
    bottom:300px;

    width:12px;
    height:135px;

    transform:
    translateX(-50%)
    scaleY(0);

    transform-origin:
    top;

    border-radius:50%;

    background:
    linear-gradient(
        var(--c1,#edb5ff),
        var(--c2,#ba4cff) 20%,
        var(--c3,#7719b8)
    );

    box-shadow:
    0 0 12px
    var(--glow,#b95cff);

    opacity:0;

    z-index:115
}

.stream.show{
    animation:
    stream 1.05s
    ease both
}

@keyframes stream{

    0%{
        opacity:0;

        transform:
        translateX(-50%)
        scaleY(0)
    }

    18%,
    78%{
        opacity:.95;

        transform:
        translateX(-50%)
        scaleY(1)
    }

    100%{
        opacity:0;

        transform:
        translateX(-50%)
        scaleY(.25)
    }

}

/* =========================
   MAGIC FLASH
========================= */

.flash{
    position:absolute;

    left:50%;
    bottom:270px;

    width:220px;
    height:110px;

    transform:
    translateX(-50%)
    scale(.3);

    border-radius:50%;

    background:
    radial-gradient(
        ellipse,
        var(--glow,#d979ff),
        transparent 70%
    );

    filter:blur(8px);

    opacity:0;

    z-index:90
}

.flash.show{
    animation:
    flash .85s ease-out
}

@keyframes flash{

    35%{
        opacity:.9;

        transform:
        translateX(-50%)
        scale(1.1)
    }

    100%{
        opacity:0;

        transform:
        translateX(-50%)
        scale(1.6)
    }

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .stage{
        transform:
        translateX(-50%)
        scale(.82)
    }

}

@media(max-width:650px){

    .stage{
        bottom:0;

        transform:
        translateX(-50%)
        scale(.66)
    }

}

@media(max-width:430px){

    .stage{
        bottom:1%;

        transform:
        translateX(-50%)
        scale(.56)
    }

}
</style>
</head>

<body>

<main
class="scene"
id="scene"
>

<section class="stage">

<div class="shadow"></div>

<!-- CAULDRON -->

<div class="cauldron">

<div class="handle l"></div>
<div class="handle r"></div>

<div class="leg l"></div>
<div class="leg r"></div>

<div class="body"></div>

<div class="rim"></div>

<div class="liquid"></div>

<div class="wave"></div>
<div class="wave w2"></div>
<div class="wave w3"></div>

<div id="bubbles"></div>

<div id="smoke"></div>

<div
class="flash"
id="flash"
></div>

</div>

<!-- POUR STREAM -->

<div
class="stream"
id="stream"
></div>

<!-- =========================
     POTION BOTTLES
========================= -->

<div class="bottles">

<!-- PURPLE -->

<button
class="bottle purple"

data-c1="#f2c1ff"
data-c2="#cf55ff"
data-c3="#8a1dcc"
data-glow="#d76cff"
>

<img
class="closed"
src="assets/potion-purple-closed.png"
alt="Ramuan ungu tertutup"
>

<img
class="open"
src="assets/potion-purple-open.png"
alt="Ramuan ungu terbuka"
>

</button>

<!-- GREEN -->

<button
class="bottle green"

data-c1="#d7ffd0"
data-c2="#6dff72"
data-c3="#159447"
data-glow="#73ff78"
>

<img
class="closed"
src="assets/potion-green-closed.png"
alt="Ramuan hijau tertutup"
>

<img
class="open"
src="assets/potion-green-open.png"
alt="Ramuan hijau terbuka"
>

</button>

<!-- BLUE -->

<button
class="bottle blue"

data-c1="#d6f8ff"
data-c2="#52c4ff"
data-c3="#0668e8"
data-glow="#68c7ff"
>

<img
class="closed"
src="assets/potion-blue-closed.png"
alt="Ramuan biru tertutup"
>

<img
class="open"
src="assets/potion-blue-open.png"
alt="Ramuan biru terbuka"
>

</button>

</div>

</section>

</main>

<script>

(()=>{

const scene=
document.querySelector('.scene');

const buttons=[
...document.querySelectorAll('.bottle')
];

const bubbles=
document.getElementById('bubbles');

const smoke=
document.getElementById('smoke');

const stream=
document.getElementById('stream');

const flash=
document.getElementById('flash');

let busy=false;


/* RANDOM */

const random=(min,max)=>
Math.random()*(max-min)+min;


/* =========================
   BUBBLES
========================= */

function createBubble(
big=false
){

if(document.hidden)return;

const element=
document.createElement('i');

const size=
random(
big ? 12 : 7,
big ? 27 : 18
);

element.className=
'bubble';

element.style.cssText=`

width:${size}px;

height:${size}px;

left:${random(15,85)}%;

--d:${random(
big ? .65 : 1.1,
big ? 1.1 : 2
)}s;

--x:${random(-45,45)}px;

`;

bubbles.appendChild(
element
);

element.onanimationend=
()=>element.remove();

}


/* =========================
   SMOKE
========================= */

function createSmoke(
big=false
){

if(document.hidden)return;

const element=
document.createElement('i');

const size=
random(
big ? 100 : 70,
big ? 180 : 135
);

element.className=
'smoke';

element.style.cssText=`

left:${random(32,68)}%;

--s:${size}px;

--b:${random(12,23)}px;

--d:${random(
big ? 2.1 : 3,
big ? 3.4 : 5
)}s;

--x:${random(-120,120)}px;

--y:${random(-350,-260)}px;

`;

smoke.appendChild(
element
);

element.onanimationend=
()=>element.remove();

}


/* AMBIENT EFFECT */

setInterval(
()=>createBubble(),
270
);

setInterval(
()=>{

if(
Math.random()>.35
){

createSmoke();

}

},
400
);


/* RESTART ANIMATION */

function restart(
element,
className
){

element.classList.remove(
className
);

void element.offsetWidth;

element.classList.add(
className
);

}


/* =========================
   BOTTLE CLICK
========================= */

buttons.forEach(
button=>{

button.onclick=()=>{

if(busy)return;

busy=true;


/* DISABLE OTHER BOTTLES */

buttons.forEach(
b=>b.disabled=true
);


/* CHANGE POUR COLOR */

scene.style.setProperty(
'--c1',
button.dataset.c1
);

scene.style.setProperty(
'--c2',
button.dataset.c2
);

scene.style.setProperty(
'--c3',
button.dataset.c3
);

scene.style.setProperty(
'--glow',
button.dataset.glow
);


/* CLOSED IMAGE
   CHANGES TO OPEN IMAGE */

button.classList.add(
'active'
);


/* POUR EFFECT */

setTimeout(
()=>{

restart(
stream,
'show'
);

restart(
flash,
'show'
);


/* STRONG BUBBLE */

for(
let i=0;
i<10;
i++
){

setTimeout(
()=>createBubble(true),
i*45
);

setTimeout(
()=>createSmoke(true),
i*70
);

}

},
1100
);


/* RETURN TO ORIGINAL */

setTimeout(
()=>{

button.classList.remove(
'active'
);

stream.classList.remove(
'show'
);

flash.classList.remove(
'show'
);

buttons.forEach(
b=>b.disabled=false
);

busy=false;

},
2720
);

};

}
);


/* BLOCK IOS ZOOM */

document.addEventListener(
'gesturestart',
event=>
event.preventDefault()
);

})();

</script>

</body>
</html>
