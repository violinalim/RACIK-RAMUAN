<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Magic Cauldron</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08040b}
body{font-family:Arial,Helvetica,sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit}

.scene{
  --stream-left:50%;
  --stream-bottom:303px;
  --stream-rotate:4deg;
  position:relative;width:100vw;height:100vh;min-height:100svh;overflow:hidden;
  background:#09050d url("https://plcl.me/images/ohwiK.png") center center/cover no-repeat;
  user-select:none;-webkit-user-select:none;isolation:isolate;
}
.scene::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 0%,transparent 58%,rgba(0,0,0,.18) 100%);
  pointer-events:none;z-index:1;
}

.stage{
  position:absolute;left:50%;bottom:1.5%;width:920px;height:720px;
  transform:translateX(-50%);transform-origin:center bottom;z-index:10;
}

.cauldron-zone{
  position:absolute;left:50%;bottom:22px;width:410px;height:410px;
  transform:translateX(-50%);z-index:30;
}
.cauldron-shadow{
  position:absolute;left:50%;bottom:4px;width:310px;height:48px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.75) 0%,rgba(0,0,0,.35) 48%,transparent 76%);
  filter:blur(10px);z-index:1;
}
.cauldron-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;z-index:20;
  pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 22px 22px rgba(0,0,0,.38));
}

/* opening zone */
.liquid-mask{
  position:absolute;left:50%;top:15.9%;width:66.5%;height:12.4%;transform:translateX(-50%);
  border-radius:50%;overflow:hidden;pointer-events:none;z-index:24;
}
.liquid-surface{
  position:absolute;inset:-18% -10%;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(255,255,255,.22) 0%, rgba(255,255,255,.08) 16%, rgba(255,255,255,0) 38%),
    radial-gradient(ellipse at 35% 50%, rgba(255,170,255,.24) 0%, rgba(255,170,255,0) 36%),
    radial-gradient(ellipse at 72% 55%, rgba(130,205,255,.18) 0%, rgba(130,205,255,0) 34%),
    linear-gradient(180deg, rgba(255,170,255,.18), rgba(175,67,255,.48) 40%, rgba(93,18,153,.88) 100%);
  opacity:.96;
  animation:liquidMove 3.6s ease-in-out infinite;
}
.liquid-surface::before{
  content:"";position:absolute;inset:-8% -12%;
  background:
    repeating-radial-gradient(ellipse at 50% 55%, rgba(255,255,255,.11) 0 4px, rgba(255,255,255,0) 4px 18px),
    repeating-linear-gradient(96deg, rgba(255,255,255,.08) 0 2px, rgba(255,255,255,0) 2px 16px);
  opacity:.65;
  mix-blend-mode:screen;
  animation:liquidRipple 2.4s linear infinite;
}
.liquid-surface::after{
  content:"";position:absolute;left:-8%;right:-8%;top:16%;height:34%;
  background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0));
  border-radius:50%;filter:blur(4px);opacity:.7;
  animation:liquidShine 2.8s ease-in-out infinite;
}
.liquid-glow{
  position:absolute;left:50%;top:15.2%;width:72%;height:15%;transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(230,120,255,.30) 0%, rgba(175,56,255,.18) 45%, transparent 75%);
  filter:blur(10px);pointer-events:none;z-index:23;animation:glowPulse 2.2s ease-in-out infinite alternate;
}
@keyframes liquidMove{
  0%{transform:translateX(-2.5%) translateY(1%) scale(1.02)}
  25%{transform:translateX(1.5%) translateY(-1.5%) scale(1.05)}
  50%{transform:translateX(3%) translateY(.5%) scale(1.06)}
  75%{transform:translateX(-1%) translateY(-1%) scale(1.04)}
  100%{transform:translateX(-2.5%) translateY(1%) scale(1.02)}
}
@keyframes liquidRipple{
  0%{transform:translateX(-2%) scale(1);opacity:.42}
  50%{transform:translateX(2%) scale(1.04);opacity:.74}
  100%{transform:translateX(-2%) scale(1);opacity:.42}
}
@keyframes liquidShine{
  0%,100%{transform:translateX(-8%) scaleX(.96);opacity:.45}
  50%{transform:translateX(8%) scaleX(1.04);opacity:.88}
}
@keyframes glowPulse{from{opacity:.42;transform:translateX(-50%) scale(.985)}to{opacity:.85;transform:translateX(-50%) scale(1.04)}}

/* Bubbles & smoke aligned to red rectangle */
#bubbles{
  position:absolute;left:50%;top:-2%;width:66%;height:20%;transform:translateX(-50%);
  pointer-events:none;overflow:visible;z-index:40;
}
#smoke{
  position:absolute;
  left:50%;
  top:-12%;
  width:112%;
  height:46%;
  transform:translateX(-50%);
  pointer-events:none;
  overflow:visible;
  z-index:42;
}
.magic-ring{
  position:absolute;left:50%;top:15.7%;width:66%;height:11%;transform:translateX(-50%) scale(.96);
  border-radius:50%;border:2px solid rgba(244,191,255,.22);
  box-shadow:0 0 18px rgba(204,84,255,.18), inset 0 0 14px rgba(221,132,255,.10);
  opacity:.34;z-index:35;pointer-events:none;animation:ringIdle 1.8s ease-in-out infinite alternate;
}
@keyframes ringIdle{to{opacity:.56;transform:translateX(-50%) scale(1.02)}}
.flash{
  position:absolute;left:50%;top:5%;width:72%;height:24%;transform:translateX(-50%) scale(.25);
  border-radius:50%;background:radial-gradient(ellipse,var(--glow,rgba(215,108,255,.68)),rgba(178,57,255,.22) 42%,transparent 74%);
  filter:blur(8px);opacity:0;z-index:38;pointer-events:none;
}
.flash.show{animation:flash .9s ease-out both}
@keyframes flash{0%{opacity:0;transform:translateX(-50%) scale(.25)}35%{opacity:1;transform:translateX(-50%) scale(1.05)}100%{opacity:0;transform:translateX(-50%) scale(1.55)}}

.bubble{
  position:absolute;bottom:12%;border-radius:50%;
  background:radial-gradient(circle at 28% 23%,rgba(255,255,255,.94) 0%,rgba(238,171,255,.70) 13%,rgba(194,75,255,.46) 42%,rgba(108,8,168,.55) 78%);
  border:1px solid rgba(244,197,255,.66);box-shadow:0 0 10px rgba(190,71,255,.30);
  animation:bubbleRise var(--duration) ease-out forwards;
}
@keyframes bubbleRise{
  0%{opacity:0;transform:translate(0,4px) scale(.24)}
  15%{opacity:1}
  58%{opacity:.95;transform:translate(var(--drift1),-24px) scale(.92)}
  100%{opacity:0;transform:translate(var(--drift2),-68px) scale(1.35)}
}

.smoke-particle{
  position:absolute;
  bottom:-2%;
  width:var(--size);
  height:calc(var(--size) * 1.5);
  border-radius:50%;
  background:
    radial-gradient(
      ellipse at 50% 55%,
      rgba(238,178,255,.74) 0%,
      rgba(208,108,255,.58) 18%,
      rgba(164,55,235,.40) 42%,
      rgba(102,24,158,.20) 68%,
      transparent 100%
    );
  filter:blur(var(--blur));
  opacity:0;
  animation:smokeRise var(--duration) cubic-bezier(.18,.45,.38,1) forwards;
}
@keyframes smokeRise{
  0%{
    opacity:0;
    transform:translate(-50%,10px) scale(.34);
  }
  10%{
    opacity:var(--opacity);
  }
  38%{
    opacity:var(--opacity-mid);
    transform:translate(calc(-50% + var(--drift1)),-52px) scale(1.02);
  }
  70%{
    opacity:var(--opacity-low);
    transform:translate(calc(-50% + var(--drift2)),-110px) scale(1.55);
  }
  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--drift3)),var(--rise)) scale(var(--scale));
  }
}

.bottles{
  position:absolute;right:-55px;bottom:0;width:430px;height:610px;z-index:120;
}
.bottle{
  position:absolute;width:145px;height:176px;border:0;background:transparent;cursor:pointer;outline:none;
  transform-origin:50% 82%;animation:bottleFloat 3.1s ease-in-out infinite;z-index:125;
  --pour-x:0px;--pour-y:60px;
}
.bottle.purple{left:165px;bottom:360px;--pour-x:-148px;--pour-y:-54px}
.bottle.green{left:250px;bottom:332px;--pour-x:-224px;--pour-y:-34px;animation-delay:.42s}
.bottle.blue{left:335px;bottom:360px;--pour-x:-300px;--pour-y:-54px;animation-delay:.84s}

.pour-mouth{
  position:absolute;
  left:50%;
  top:43px;
  width:2px;
  height:2px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:0;
  z-index:200;
}

.pour-target{
  position:absolute;
  left:50%;
  top:18.8%;
  width:2px;
  height:2px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:0;
  z-index:200;
}

.bottle:hover,.bottle:focus-visible{filter:brightness(1.10) drop-shadow(0 0 16px rgba(206,94,255,.40))}
.bottle img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;
  pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 12px 11px rgba(0,0,0,.20));transition:opacity .16s ease;
}
.bottle .open{opacity:0}
.bottle.active .closed{opacity:0}
.bottle.active .open{opacity:1}
.bottle.active{
  z-index:175;pointer-events:none;animation:bottlePour 2.7s cubic-bezier(.4,0,.2,1) both;
  filter:brightness(1.12) drop-shadow(0 0 18px var(--glow,rgba(205,85,255,.65)));
}
@keyframes bottleFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes bottlePour{
  0%{transform:translate(0,0) rotate(0deg)}
  14%{transform:translate(-6px,-26px) rotate(-8deg)}
  38%{transform:translate(calc(var(--pour-x) * .55),18px) rotate(-30deg)}
  50%,72%{transform:translate(var(--pour-x),var(--pour-y)) rotate(-72deg)}
  82%{transform:translate(calc(var(--pour-x) * .35),12px) rotate(-24deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}


.pour-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
  z-index:115;
  opacity:0;
}
.pour-svg.show{
  opacity:1;
}
.pour-glow{
  fill:none;
  stroke:var(--glow,#d76cff);
  stroke-width:28;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.22;
  filter:blur(5px);
}
.pour-main{
  fill:none;
  stroke:url(#potionGradient);
  stroke-width:15;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 8px var(--glow,#d76cff));
  animation:pourPulse .42s ease-in-out infinite alternate;
}
.pour-highlight{
  fill:none;
  stroke:rgba(255,255,255,.72);
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.72;
}
.pour-splash{
  fill:var(--c2,#cf55ff);
  opacity:.0;
  transform-box:fill-box;
  transform-origin:center;
}
.pour-svg.show .pour-splash{
  animation:splashReal .34s ease-in-out infinite alternate;
}
@keyframes pourPulse{
  from{stroke-width:13.5;opacity:.90}
  to{stroke-width:16.5;opacity:1}
}
@keyframes splashReal{
  from{opacity:.35;transform:scale(.82)}
  to{opacity:.88;transform:scale(1.18)}
}

/* BROOM ANIMATION - BESAR, GAGANG PANJANG, MUNCUL DARI LUAR LAYAR */
.broom-lane{
  position:absolute;
  left:50%;
  bottom:82px;
  width:1380px;
  height:500px;
  transform:translateX(-50%);
  z-index:18;
  pointer-events:none;
  overflow:visible;
  opacity:0;
  visibility:hidden;
}
.broom-lane.show{
  opacity:1;
  visibility:visible;
}

.broom-wrap{
  position:absolute;
  left:-520px;
  bottom:-34px;
  width:470px;
  height:470px;
  will-change:transform;
}

/* sapu melintas sepenuhnya dari luar kiri ke luar kanan */
.broom-lane.show .broom-wrap{
  animation:broomPass 8.6s cubic-bezier(.18,.05,.12,1) 1 both;
}

.broom-img{
  position:absolute;
  left:50%;
  bottom:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  transform:translateX(-50%) rotate(-16deg);
  transform-origin:50% 88%;
  filter:drop-shadow(0 15px 18px rgba(0,0,0,.30));
  user-select:none;
  -webkit-user-drag:none;
  animation:none;
}

/* ayunan tidak bergoyang bolak-balik; gagang perlahan mengayun ke kanan */
.broom-lane.show .broom-img{
  animation:broomSweepStroke .92s cubic-bezier(.20,.02,.18,1) infinite;
}

.broom-shadow{
  position:absolute;
  left:50%;
  bottom:30px;
  width:188px;
  height:32px;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.34) 0%,rgba(0,0,0,.14) 50%,transparent 76%);
  transform:translateX(-50%);
  filter:blur(7px);
  opacity:0;
}
.broom-lane.show .broom-shadow{
  animation:broomShadowPass 8.6s ease-in-out 1 both;
}

.dust{
  position:absolute;
  left:96px;
  bottom:42px;
  width:190px;
  height:82px;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 60%,rgba(197,156,255,.14) 0%,rgba(175,120,255,.08) 38%,rgba(175,120,255,0) 78%);
  filter:blur(11px);
  opacity:0;
}
.broom-lane.show .dust{
  animation:dustTrail 8.6s ease-out 1 both;
}

@keyframes broomPass{
  0%   {transform:translateX(0) translateY(2px)}
  8%   {transform:translateX(120px) translateY(1px)}
  22%  {transform:translateX(330px) translateY(-1px)}
  40%  {transform:translateX(585px) translateY(0)}
  58%  {transform:translateX(840px) translateY(-2px)}
  76%  {transform:translateX(1095px) translateY(0)}
  92%  {transform:translateX(1335px) translateY(1px)}
  100% {transform:translateX(1590px) translateY(2px)}
}

@keyframes broomSweepStroke{
  0%   {transform:translateX(-50%) rotate(-20deg)}
  18%  {transform:translateX(-50%) rotate(-15deg)}
  42%  {transform:translateX(-50%) rotate(-8deg)}
  68%  {transform:translateX(-50%) rotate(1deg)}
  86%  {transform:translateX(-50%) rotate(10deg)}
  100% {transform:translateX(-50%) rotate(15deg)}
}

@keyframes broomShadowPass{
  0%   {opacity:0;transform:translateX(-50%) scale(.88)}
  12%  {opacity:.20;transform:translateX(-50%) scale(.96)}
  40%  {opacity:.30;transform:translateX(-50%) scale(1.04)}
  65%  {opacity:.27;transform:translateX(-50%) scale(1.08)}
  88%  {opacity:.18;transform:translateX(-50%) scale(1.00)}
  100% {opacity:0;transform:translateX(-50%) scale(.90)}
}

@keyframes dustTrail{
  0%   {opacity:0;transform:translateX(-12px) scale(.82)}
  14%  {opacity:.18;transform:translateX(0) scale(.94)}
  38%  {opacity:.34;transform:translateX(18px) scale(1.06)}
  64%  {opacity:.28;transform:translateX(34px) scale(1.18)}
  86%  {opacity:.14;transform:translateX(52px) scale(1.26)}
  100% {opacity:0;transform:translateX(70px) scale(1.34)}
}

@media (min-width: 1200px){
  .stage{width:920px;height:720px}
}
@media(max-width:980px){
  .stage{transform:translateX(-50%) scale(.88)}
  .bottles{right:-40px}
  .broom-lane{width:1180px;bottom:78px;height:440px}
  .broom-wrap{width:420px;height:420px;left:-500px}
}
@media(max-width:760px){
  .stage{bottom:.5%;width:820px;height:680px;transform:translateX(-50%) scale(.70)}
  .bottles{right:-26px}
  .broom-lane{width:980px;bottom:70px;height:390px}
  .broom-wrap{width:375px;height:375px;left:-460px}
}
@media(max-width:540px){
  .scene{background-position:center center}
  .stage{bottom:1.5%;width:720px;height:650px;transform:translateX(-50%) scale(.54)}
  .cauldron-zone{bottom:38px}
  .bottles{right:-18px}
  .broom-lane{width:820px;bottom:62px;height:340px}
  .broom-wrap{width:330px;height:330px;left:-420px}
}
@media(max-width:420px){
  .stage{bottom:3%;width:670px;height:620px;transform:translateX(-50%) scale(.48)}
  .cauldron-zone{bottom:58px}
  .bottles{right:-12px}
  .broom-lane{width:700px;bottom:58px;height:310px}
  .broom-wrap{width:295px;height:295px;left:-390px}
}
@media(max-height:620px) and (orientation:landscape){
  .stage{bottom:-3%;transform:translateX(-50%) scale(.68)}
}
</style>
</head>
<body>
<main class="scene" id="scene">
  <section class="stage" id="stage">
    <div class="cauldron-zone">
      <div class="cauldron-shadow"></div>
      <img src="assets/cauldron.png" class="cauldron-img" alt="Kuali sihir" draggable="false">
      <div class="liquid-glow"></div>
      <div class="liquid-mask"><div class="liquid-surface"></div></div>
      <div class="magic-ring"></div>
      <span class="pour-target" id="pourTarget" aria-hidden="true"></span>
      <div id="bubbles"></div>
      <div id="smoke"></div>
      <div class="flash" id="flash"></div>
    </div>

    <div class="broom-lane" aria-hidden="true">
      <div class="broom-wrap">
        <div class="dust"></div>
        <div class="broom-shadow"></div>
        <img src="assets/broom.png" class="broom-img" alt="Sapu terbang" draggable="false">
      </div>
    </div>


    <svg class="pour-svg" id="pourSvg" aria-hidden="true">
      <defs>
        <linearGradient id="potionGradient" gradientUnits="userSpaceOnUse">
          <stop offset="0%" style="stop-color:var(--c1,#f6d0ff)"/>
          <stop offset="45%" style="stop-color:var(--c2,#cf55ff)"/>
          <stop offset="100%" style="stop-color:var(--c3,#8a1dcc)"/>
        </linearGradient>
      </defs>
      <path class="pour-glow" id="pourGlow"></path>
      <path class="pour-main" id="pourMain"></path>
      <path class="pour-highlight" id="pourHighlight"></path>
      <ellipse class="pour-splash" id="pourSplash" rx="22" ry="7"></ellipse>
    </svg>

    <div class="bottles">
      <button class="bottle purple" type="button" aria-label="Ramuan ungu" data-c1="#f4c5ff" data-c2="#d052ff" data-c3="#8617cc" data-glow="rgba(220,98,255,.78)">
        <img class="closed" src="assets/potion-purple-closed.png" alt="Ramuan ungu tertutup">
        <img class="open" src="assets/potion-purple-open.png" alt="Ramuan ungu terbuka">
        <span class="pour-mouth" aria-hidden="true"></span>
      </button>
      <button class="bottle green" type="button" aria-label="Ramuan hijau" data-c1="#e1ffd6" data-c2="#73ff72" data-c3="#169747" data-glow="rgba(116,255,126,.76)">
        <img class="closed" src="assets/potion-green-closed.png" alt="Ramuan hijau tertutup">
        <img class="open" src="assets/potion-green-open.png" alt="Ramuan hijau terbuka">
        <span class="pour-mouth" aria-hidden="true"></span>
      </button>
      <button class="bottle blue" type="button" aria-label="Ramuan biru" data-c1="#dffaff" data-c2="#56c8ff" data-c3="#056eea" data-glow="rgba(104,201,255,.78)">
        <img class="closed" src="assets/potion-blue-closed.png" alt="Ramuan biru tertutup">
        <img class="open" src="assets/potion-blue-open.png" alt="Ramuan biru terbuka">
        <span class="pour-mouth" aria-hidden="true"></span>
      </button>
    </div>
  </section>
</main>
<script>
(()=>{
  "use strict";

  const scene = document.getElementById("scene");
  const bottles = [...document.querySelectorAll(".bottle")];
  const bubbles = document.getElementById("bubbles");
  const smoke = document.getElementById("smoke");
  const pourSvg = document.getElementById("pourSvg");
  const pourGlow = document.getElementById("pourGlow");
  const pourMain = document.getElementById("pourMain");
  const pourHighlight = document.getElementById("pourHighlight");
  const pourSplash = document.getElementById("pourSplash");
  const flash = document.getElementById("flash");
  const broomLane = document.querySelector(".broom-lane");
  const stage = document.getElementById("stage");
  const pourTarget = document.getElementById("pourTarget");

  let busy = false;
  let bubbleTimer;
  let smokeTimer;
  let streamRAF = 0;
  let broomTimer = 0;
  let broomHideTimer = 0;
  const broomDuration = 8800;

  const random = (min,max) => Math.random() * (max-min) + min;

  function makeBubble(big=false){
    if(document.hidden) return;
    const b = document.createElement("span");
    b.className = "bubble";
    const size = random(big ? 11 : 5, big ? 26 : 14);
    b.style.width = `${size}px`;
    b.style.height = `${size * random(.72,1)}px`;
    b.style.left = `${random(10,90)}%`;
    b.style.setProperty("--duration", `${random(big ? .72 : 1.0, big ? 1.2 : 1.7)}s`);
    b.style.setProperty("--drift1", `${random(-18,18)}px`);
    b.style.setProperty("--drift2", `${random(-30,30)}px`);
    bubbles.appendChild(b);
    b.addEventListener("animationend",()=>b.remove(),{once:true});
  }

  function makeSmoke(big=false){
    if(document.hidden) return;

    const s = document.createElement("span");
    s.className = "smoke-particle";

    const size = random(big ? 120 : 92, big ? 220 : 165);

    s.style.left = `${random(26,74)}%`;
    s.style.setProperty("--size", `${size}px`);
    s.style.setProperty("--blur", `${random(16,28)}px`);
    s.style.setProperty("--duration", `${random(big ? 2.4 : 3.2, big ? 4.0 : 5.0)}s`);

    /* asap normal tebal, saat menuang jauh lebih tebal */
    s.style.setProperty("--opacity", big ? random(.70,.90) : random(.42,.58));
    s.style.setProperty("--opacity-mid", big ? random(.48,.66) : random(.28,.40));
    s.style.setProperty("--opacity-low", big ? random(.22,.34) : random(.14,.22));

    s.style.setProperty("--drift1", `${random(-32,32)}px`);
    s.style.setProperty("--drift2", `${random(-68,68)}px`);
    s.style.setProperty("--drift3", `${random(-110,110)}px`);
    s.style.setProperty("--rise", `${random(-190,-125)}px`);
    s.style.setProperty("--scale", random(1.7,2.45));

    smoke.appendChild(s);
    s.addEventListener("animationend",()=>s.remove(),{once:true});
  }

  function restartAnimation(element,className){
    element.classList.remove(className);
    void element.offsetWidth;
    element.classList.add(className);
  }

  function burst(){
    for(let i=0;i<14;i++){
      setTimeout(()=>makeBubble(true), i*38);
    }

    /* asap utama saat ramuan dituangkan */
    for(let i=0;i<18;i++){
      setTimeout(()=>makeSmoke(true), i*44);
    }

    /* asap susulan agar terlihat padat dan menyebar */
    for(let i=0;i<8;i++){
      setTimeout(()=>makeSmoke(true), 420 + (i*52));
    }
  }

  function setPotionColors(button){
    scene.style.setProperty("--c1", button.dataset.c1);
    scene.style.setProperty("--c2", button.dataset.c2);
    scene.style.setProperty("--c3", button.dataset.c3);
    scene.style.setProperty("--glow", button.dataset.glow);
  }


  function updatePourGeometry(button){
    const mouth = button.querySelector(".pour-mouth");
    if(!mouth || !pourTarget || !stage || !pourSvg) return;

    const stageRect = stage.getBoundingClientRect();
    const mouthRect = mouth.getBoundingClientRect();
    const targetRect = pourTarget.getBoundingClientRect();

    const scaleX = stageRect.width / stage.offsetWidth || 1;
    const scaleY = stageRect.height / stage.offsetHeight || 1;

    const sx = ((mouthRect.left + mouthRect.width / 2) - stageRect.left) / scaleX;
    const sy = ((mouthRect.top + mouthRect.height / 2) - stageRect.top) / scaleY;
    const tx = ((targetRect.left + targetRect.width / 2) - stageRect.left) / scaleX;
    const ty = ((targetRect.top + targetRect.height / 2) - stageRect.top) / scaleY;

    pourSvg.setAttribute("viewBox", `0 0 ${stage.offsetWidth} ${stage.offsetHeight}`);

    const dx = tx - sx;
    const dy = ty - sy;
    const distance = Math.hypot(dx,dy);

    /* natural liquid arc: leaves the bottle, then gravity pulls it down */
    const c1x = sx + dx * .20;
    const c1y = sy + Math.min(8, distance * .03);
    const c2x = tx - dx * .08;
    const c2y = ty - Math.min(42, distance * .18);

    const d = `M ${sx.toFixed(2)} ${sy.toFixed(2)} C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${tx.toFixed(2)} ${ty.toFixed(2)}`;

    pourGlow.setAttribute("d", d);
    pourMain.setAttribute("d", d);
    pourHighlight.setAttribute("d", d);
    pourSplash.setAttribute("cx", tx.toFixed(2));
    pourSplash.setAttribute("cy", ty.toFixed(2));

    const gradient = document.getElementById("potionGradient");
    if(gradient){
      gradient.setAttribute("x1", sx.toFixed(2));
      gradient.setAttribute("y1", sy.toFixed(2));
      gradient.setAttribute("x2", tx.toFixed(2));
      gradient.setAttribute("y2", ty.toFixed(2));
    }
  }

  function followPour(button){
    cancelAnimationFrame(streamRAF);

    const tick = ()=>{
      if(!button.classList.contains("active") || !pourSvg.classList.contains("show")){
        cancelAnimationFrame(streamRAF);
        streamRAF = 0;
        return;
      }

      updatePourGeometry(button);
      streamRAF = requestAnimationFrame(tick);
    };

    tick();
  }

  function clearBroomTimers(){
    clearTimeout(broomTimer);
    clearTimeout(broomHideTimer);
    broomTimer = 0;
    broomHideTimer = 0;
  }

  function scheduleNextBroom(){
    clearTimeout(broomTimer);
    if(document.hidden) return;
    const delay = Math.floor(random(3000, 10001));
    broomTimer = setTimeout(showBroomOnce, delay);
  }

  function showBroomOnce(){
    if(document.hidden || !broomLane){
      scheduleNextBroom();
      return;
    }

    broomLane.classList.remove("show");
    void broomLane.offsetWidth;
    broomLane.classList.add("show");

    broomHideTimer = setTimeout(()=>{
      broomLane.classList.remove("show");
      scheduleNextBroom();
    }, broomDuration);
  }

  function activateBottle(button){
    if(busy) return;
    busy = true;
    setPotionColors(button);
    bottles.forEach(b=>b.disabled=true);
    button.classList.add("active");

    setTimeout(()=>{
      updatePourGeometry(button);
      pourSvg.classList.add("show");
      followPour(button);
      restartAnimation(flash,"show");
      burst();
    }, 1260);

    setTimeout(()=>{
      pourSvg.classList.remove("show");
      cancelAnimationFrame(streamRAF);
      streamRAF = 0;
    }, 2040);

    setTimeout(()=>{
      button.classList.remove("active");
      flash.classList.remove("show");
      bottles.forEach(b=>b.disabled=false);
      busy = false;
    }, 2740);
  }

  bottles.forEach(button=>{
    button.addEventListener("click", ()=>activateBottle(button));
  });

  function startAmbient(){
    clearInterval(bubbleTimer);
    clearInterval(smokeTimer);

    bubbleTimer = setInterval(()=>makeBubble(false), 320);

    /* asap idle lebih sering agar tidak terlihat tipis */
    smokeTimer = setInterval(()=>{
      if(Math.random() > .08) makeSmoke(false);
    }, 300);
  }

  startAmbient();
  scheduleNextBroom();
  for(let i=0;i<7;i++){
    setTimeout(()=>makeBubble(false), i*120);
    if(i<6) setTimeout(()=>makeSmoke(false), i*130);
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      clearInterval(bubbleTimer);
      clearInterval(smokeTimer);
      clearBroomTimers();
      if(broomLane) broomLane.classList.remove("show");
    }else{
      startAmbient();
      scheduleNextBroom();
      updateStageScale();
    }
  });

  function updateStageScale(){
    if(!stage || !scene) return;

    const stageWidth = stage.offsetWidth || 920;
    const stageHeight = stage.offsetHeight || 720;
    const availableWidth = Math.max(320, scene.clientWidth - 24);
    const availableHeight = Math.max(320, scene.clientHeight - 16);

    const widthScale = availableWidth / stageWidth;
    const heightScale = availableHeight / stageHeight;

    const scale = Math.max(.44, Math.min(widthScale, heightScale, 1.08));
    stage.style.transform = `translateX(-50%) scale(${scale})`;
  }

  window.addEventListener("resize", updateStageScale);
  window.addEventListener("orientationchange", updateStageScale);
  updateStageScale();

  /* Block browser zoom */
  window.addEventListener("wheel", (e)=>{ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
  document.addEventListener("keydown", (e)=>{
    if((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault();
  });
  document.addEventListener("gesturestart", e=>e.preventDefault());
  document.addEventListener("gesturechange", e=>e.preventDefault());
  document.addEventListener("gestureend", e=>e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e)=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
})();
</script>
</body>
</html>
